name: Publish to Maven Central

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (with or without a leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pushed release tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/validate-semver-tag.py "$TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - id: version
        name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          test -n "$version"
          case "$version" in *-SNAPSHOT) exit 1 ;; esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Publish signed release
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          ./gradlew --no-daemon publishAggregationToCentralPortal
